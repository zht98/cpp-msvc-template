name: MSVC Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Build
      run: cl /EHsc launcher.c

    - name: Verify build
      run: dir launcher.exe

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: launcher
        path: launcher.exe
