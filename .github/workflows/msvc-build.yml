name: MSVC Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Build
      run: cl /EHsc launcher.c

    - name: Verify build
      run: dir launcher.exe

    # 新增：将生成的 launcher.exe 提交并推送到仓库
    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add launcher.exe
        git commit -m "Auto build: update launcher.exe" || echo "No changes to commit"
        git push
