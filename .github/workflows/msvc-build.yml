name: MSVC Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Compile Resource (Icon)
      run: rc resource.rc

    - name: Build
      run: cl /EHsc launcher.c resource.res user32.lib /link /subsystem:windows /MANIFEST:EMBED /MANIFESTINPUT:launcher.exe.manifest

    - name: Verify build
      run: dir launcher.exe

    # 上传至 Actions Artifacts 作为备份
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: launcher
        path: launcher.exe

    # 自动发布到 Releases
    - name: Create Release and Upload Asset
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Launcher Release v1.0.${{ github.run_number }}
        body: |
          包含自定义图标、隐藏黑框及路径保护功能的自动构建版本。
        files: |
          launcher.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
