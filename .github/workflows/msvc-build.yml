name: MSVC Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Build
      run: cl /EHsc launcher.c /link /subsystem:windows /MANIFEST:EMBED /MANIFESTINPUT:launcher.exe.manifest

    - name: Verify build
      run: dir launcher.exe

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: launcher
        path: launcher.exe

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add launcher.exe
        git commit -m "Auto build: update launcher.exe with manifest" || echo "No changes to commit"
        git push
